<svg xmlns="http://www.w3.org/2000/svg" width="440" height="662" viewBox="0 0 440 662" role="img" aria-labelledby="nebula-ipsec-overlay-structure-title nebula-ipsec-overlay-structure-desc">
<title id="nebula-ipsec-overlay-structure-title">Nebula와 호스트 간 IPsec 터널</title>
<desc id="nebula-ipsec-overlay-structure-desc">필드 순서는 위에서 아래로 읽는다. 청록색 ENC 영역만 암호화하며 보라색은 인증 관련 필드다. 개념도이며 실제 바이트 폭이 아니다.</desc>
<style>text{font-family:"Noto Sans CJK KR",sans-serif;font-size:20px;fill:#e7eef9} .heading{font-size:23px;font-weight:700} .note{font-size:18px;fill:#b8c9df}</style>
<rect width="440" height="662" rx="16" fill="#0b1220"/>
<text x="22" y="35" class="heading">Nebula와 호스트 간 IPsec 터널</text>
<text x="22" y="66" class="note">필드 순서: 위 → 아래 · 폭은 비례하지 않음</text>
<text x="22" y="116" class="heading">Nebula · 구조 개념도</text>
<rect x="22" y="131" width="396" height="34" rx="7" fill="#15243a" stroke="#6c88aa" stroke-width="1.5"/>
<text x="35" y="155" style="fill:#e7eef9">Underlay IP</text>
<rect x="22" y="170" width="396" height="34" rx="7" fill="#15243a" stroke="#6c88aa" stroke-width="1.5"/>
<text x="35" y="194" style="fill:#e7eef9">UDP</text>
<rect x="22" y="209" width="396" height="34" rx="7" fill="#15243a" stroke="#6c88aa" stroke-width="1.5"/>
<text x="35" y="233" style="fill:#e7eef9">Nebula framing</text>
<rect x="22" y="248" width="396" height="58" rx="7" fill="#0d343a" stroke="#5ad5cf" stroke-width="1.5"/>
<text x="35" y="272" style="fill:#ccfffa">ENC · Overlay IP</text>
<text x="35" y="296" style="fill:#ccfffa">+ TCP/UDP + Data</text>
<text x="22" y="350" class="heading">IPsec host-to-host tunnel</text>
<rect x="22" y="365" width="396" height="34" rx="7" fill="#15243a" stroke="#6c88aa" stroke-width="1.5"/>
<text x="35" y="389" style="fill:#e7eef9">Underlay IP · ESP AAD 아님</text>
<rect x="22" y="404" width="396" height="34" rx="7" fill="#2b2046" stroke="#b69be8" stroke-width="1.5"/>
<text x="35" y="428" style="fill:#ecddff">ESP · SPI / Sequence = AAD</text>
<rect x="22" y="443" width="396" height="34" rx="7" fill="#15243a" stroke="#6c88aa" stroke-width="1.5"/>
<text x="35" y="467" style="fill:#e7eef9">IV · ENC 밖</text>
<rect x="22" y="482" width="396" height="58" rx="7" fill="#0d343a" stroke="#5ad5cf" stroke-width="1.5"/>
<text x="35" y="506" style="fill:#ccfffa">ENC · Inner IP + TCP/UDP</text>
<text x="35" y="530" style="fill:#ccfffa">+ Data + trailer</text>
<rect x="22" y="545" width="396" height="34" rx="7" fill="#2b2046" stroke="#b69be8" stroke-width="1.5"/>
<text x="35" y="569" style="fill:#ecddff">Tag · ENC 밖</text>
<text x="22" y="616" class="note">P2P는 토폴로지 · 모드는 캡슐화 방식</text>
<text x="22" y="641" class="note">Nebula는 IKEv2/ESP가 아닌 자체 프로토콜</text>
</svg>
