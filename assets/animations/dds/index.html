<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DDS · 개념을 연결하는 지도</title><link rel="stylesheet" href="player.css"><script src="scenes.js" defer></script><script src="player.js" defer></script></head><body><main id="player" tabindex="0" aria-label="DDS 설명 애니메이션"><header><p class="eyebrow">DDS / A VISUAL FIELD GUIDE</p><h1 id="title">DDS 개념을 연결하는 지도</h1><p id="subtitle" class="subtitle"></p><label class="topic-select">주제<select id="topic"></select></label><ol id="steps" class="steps" aria-label="학습 단계"></ol></header><figure><div class="vector-scroll" tabindex="0" role="region" aria-label="DDS 도식: 좁은 화면에서 좌우 스크롤"><svg id="scene" viewBox="0 0 680 480" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">DDS 개념</title><desc id="svg-desc">JavaScript를 사용하면 주제별 설명용 도식을 표시합니다.</desc></svg></div><p class="vector-help">↔ 도식은 좌우로 스크롤할 수 있습니다. 설명과 조작은 화면 안에 유지됩니다.</p><p id="stage-note" aria-live="polite"></p><figcaption id="caption">설명용 도식이며 실제 네트워크·암호·운영체제 측정이 아닙니다.</figcaption></figure><section class="controls" aria-label="재생 조작"><button id="play" type="button" aria-pressed="false">재생</button><button id="restart" type="button">처음</button><label class="timeline">시간<input id="seek" type="range" min="0" max="14" step="0.01" value="0"></label><output id="clock">0.0 / 14초</output><label>속도<select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label></section><p class="help">Space 재생·정지 · ←/→ 1초 이동 · Home 처음 · End 끝</p><details><summary>텍스트로 읽기 / 범위와 가정</summary><p id="fallback">DDS 개념의 관계를 나타내는 설명용 모형입니다.</p></details><noscript><p>이 도식은 JavaScript가 필요합니다. DDS는 타입이 있는 Topic의 데이터를 Writer와 Reader 사이에 전달합니다. Discovery가 endpoint와 Locator를 찾고 QoS 조건이 맞아야 통신합니다. QoS, 메모리 history, persistence, 보안, 장비 변환, Linux 태스크 시간, 앱 상태 판단은 각각 다른 책임입니다. 실제 측정이 아닌 설명용 예시이며, 해당 글의 도식 아래 텍스트에서 주제별 설명을 읽을 수 있습니다.</p></noscript></main></body></html>
