<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPsec 개념 애니메이션</title><link rel="icon" href="data:,"><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;background:#090f1d;color:#eaf2ff}*{box-sizing:border-box}body{margin:0;padding:16px;max-width:1180px;margin-inline:auto}header{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}h1{font-size:22px;margin:0}.badge{font:12px monospace;color:#72bcff}motion-canvas-player{display:block;width:100%;aspect-ratio:16/9;border:1px solid #29415f;border-radius:14px;overflow:hidden;background:#090f1d}motion-canvas-player::part(play-button){display:none}motion-canvas-player::part(overlay){background:transparent}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}button,select{background:#142239;color:#eaf2ff;border:1px solid #496080;border-radius:8px;padding:9px 11px;font:inherit;font-size:14px;cursor:pointer}button:disabled,select:disabled{opacity:.45;cursor:wait}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #72bcff;outline-offset:3px}#play{border-color:#56e3ba;min-width:105px}#status,#time{color:#9bb0cc;font-size:13px}#time{margin-left:auto}label{font-size:13px}#seek{width:100%;accent-color:#56e3ba;margin:8px 0 14px}#chapter-title{font-size:18px;margin:0}#chapters{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}#chapters button{font-size:13px}#chapters [aria-current=true]{color:#56e3ba;border-color:#56e3ba}#summary{font-size:16px;line-height:1.75;color:#cbd9ed;min-height:56px;margin:12px 0}.note{font-size:13px;line-height:1.8;color:#9bb0cc;border-top:1px solid #29415f;padding-top:10px}summary{cursor:pointer;color:#cbd9ed}a{color:#72bcff}details p{overflow-wrap:anywhere}@media(max-width:550px){body{padding:10px}h1{font-size:18px}.badge{display:none}.toolbar{gap:6px}button,select{font-size:13px;padding:9px}#summary{font-size:15px}#time{margin-left:0}}
</style></head><body>
<header><h1 id="topic-title">IPsec 개념 애니메이션</h1><span class="badge">MOTION CANVAS · CONCEPTUAL</span></header>
<motion-canvas-player src="./project.js" tabindex="0" aria-label="IPsec 개념 애니메이션"></motion-canvas-player>
<div class="toolbar"><button id="play" disabled aria-label="재생">▶ 재생</button><button id="restart" disabled>처음</button><button id="prev" disabled>← 이전</button><button id="next" disabled>다음 →</button><label for="speed">속도</label><select id="speed" disabled><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><output id="time"></output></div>

<p class="note">자동 재생 없음 · 키보드: Space 재생/일시정지, ←/→ 장면 이동. 작은 화면에서는 한국어 설명을 함께 읽어 주세요.</p>
