<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPsec · 키에서 패킷까지</title><link rel="stylesheet" href="player.css"><script src="scenes.js" defer></script><script src="player.js" defer></script></head><body><main id="player" tabindex="0" aria-label="IPsec 설명 애니메이션"><header><p class="eyebrow">IPSEC / A VISUAL FIELD GUIDE</p><h1 id="title">키에서 패킷까지</h1><p id="subtitle" class="subtitle"></p><ol id="steps" class="steps" aria-label="학습 단계"></ol></header><figure><div class="vector-scroll" tabindex="0" role="region" aria-label="IPsec 도식: 좁은 화면에서 좌우 스크롤"><svg id="scene" viewBox="0 0 680 510" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">IPsec 키 수명주기</title><desc id="svg-desc">사전 인증 재료와 세션 키를 구분합니다.</desc></svg></div><p class="vector-help">↔ 도식은 좌우로 스크롤할 수 있습니다. 설명과 조작은 화면 안에 유지됩니다.</p><figcaption id="caption">설명용 도식입니다.</figcaption></figure><section class="controls" aria-label="재생 조작"><button id="play" type="button" aria-pressed="false">재생</button><button id="restart" type="button">처음</button><label class="timeline">시간<input id="seek" type="range" min="0" max="14" step="0.01" value="0"></label><output id="clock">0.0 / 14초</output><label>속도<select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label></section><p class="help">Space 재생·정지 · ←/→ 1초 이동 · Home 처음 · End 끝</p><details><summary>텍스트로 읽기 / 범위와 가정</summary><p id="fallback">실제 암호 연산이나 패킷 캡처가 아닙니다.</p></details><noscript><p>PSK는 사전 배포된 인증 비밀입니다. DH 공개값 교환 후 양쪽은 Z와 IKE 키를 로컬에서 계산합니다. IKE_AUTH는 피어 AUTH 검증과 첫 Child SA 협상을 수행합니다. 성공 후 별도로 파생한 방향별 ESP 키로 사용자 IP 패킷을 보호합니다. PSK를 모르는 중간자는 두 DH의 IKE 키를 알아도 변경된 교환에 맞는 AUTH를 만들 수 없습니다. 인증 실패 시 ESP 데이터 연결을 승인하지 않습니다. 실제 암호 연산이나 패킷 캡처가 아닌 설명용 도식입니다.</p></noscript></main></body></html>
